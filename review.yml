switchingCost:
  interfaceShape:
    value: proprietary-undocumented
    standardNamed: none
    evidence: |
      No open standard is referenced anywhere in the CAA's published API surface.
      There is no OpenAPI, no AsyncAPI, no AIXM or ICAO aeronautical data-exchange
      service published by the CAA, no OGC/INSPIRE endpoint, and no OData or CKAN
      instance on a caa.co.uk domain.

      The CAA regulates the UK Aeronautical Information Service — "the origination,
      management, transmission and distribution of the aeronautical data and
      aeronautical information that is published in Aeronautical Information
      Publications" — but does not itself publish the UK AIP or NOTAM as a digital
      service; that is done by NATS at nats-uk.ead-it.com. The CAA's own page on
      aeronautical information mentions no AIXM, no digital data service and no API,
      and directs data submitters to an Aeronautical Data Management Portal and to
      aimr@caa.co.uk.

      The only documented API is Citizen Space API v2.4, a proprietary interface
      designed by Delib. It is not an open standard, but it is implemented
      identically across every Citizen Space deployment in the UK public sector,
      which makes it unusually portable for a proprietary shape — code written
      against consultations.caa.co.uk works against any other Citizen Space tenant.

      The aviation surfaces that matter (G-INFO aircraft register, Check an ATOL)
      are undocumented and origin-locked. Classified proprietary-undocumented on
      the strength of what a consumer of CAA aviation data actually faces.
  secondSource:
    value: no-alternative
    alternativesConsidered: |
      For the CAA's regulatory outputs there is, by statute, no second source.
      Alternatives considered and rejected:
        - G-INFO / UK aircraft register: the CAA is the statutory registrar under the
          Air Navigation Order. Commercial aviation data vendors resell register
          extracts but are downstream of the CAA and carry no legal authority. The
          CAA's own "other data sources" page links only to OTHER states' registers
          (Bosnia, Moldova, Spain), not to alternative sources for the UK register.
        - ATOL holder status: ATOL is a UK statutory licensing scheme. Only the CAA
          issues, revokes and publishes it. ABTA membership is a different scheme
          covering different risk and is not a substitute.
        - UK airport, airline and punctuality statistics: the CAA collects these under
          statutory returns from more than 60 UK airports. OAG, Cirium and ACI publish
          overlapping commercial datasets, but not the statutory series, and not the
          route-level returns airports are compelled to file with the CAA.
        - Consultation data: this one genuinely has alternatives — the Citizen Space
          API shape is shared across the wider UK public sector — but it is the least
          commercially significant surface the CAA operates.
      An organisation that needs authoritative UK aircraft registration or ATOL
      licensing data cannot obtain it from anyone else.
  exitPath:
    value: export-on-request
    operationCited: |
      No export, dump, bulk or data-portability OPERATION is published. There is no
      /export endpoint on any CAA host, and neither undocumented aviation backend
      exposes one.

      What exists instead is an order-and-email process and a statutory request
      route:
        - G-INFO bulk register: ordered via a form; "The product is now e-mailed to
          customers as an MS Excel file"; paid subscription; fees on the order form.
        - Historic ATOL holders: a single published XLSX (verified 200, 1.39 MB) at
          /media/3ybn1oqx/historic-atolholders-combined-data-authorisation-report-2009-2025.xlsx.
        - Statistical series: individual CSV and PDF tables behind opaque
          /Documents/Download/{siteId}/{guid}/{docId} URLs with no index, no
          enumeration and no manifest. Verified: Table 01 Size of UK Airports,
          May 2026, HTTP 200, text/csv, 3,513 bytes.
        - Statutory route: "Your legal right of access to information is covered by
          the Freedom of Information Act 2000, the Environmental Information
          Regulations 2004 or, in the case of personal information, the UK General
          Data Protection Regulation (UK GDPR) and Data Protection Act 2018."
      Data portability therefore runs through FOI/EIR/SAR requests and paid orders,
      not through a documented export.
  identifierPortability:
    value: |
      Strongly portable industry identifiers, weakly portable delivery. The G-INFO
      register's documented data fields hang on shared aviation identifiers that
      travel between systems without translation:
        - UK nationality and registration mark ("Mark", e.g. G-EZBA)
        - ICAO 24-bit aircraft address, published in "binary, hexadecimal and octal
          versions", used for Mode S transponders and ELT
        - ICAO aircraft type designator, "two, three or four-character alphanumeric
          code" per ICAO Doc 8643
        - Manufacturer's serial number / constructor's number / PFA project number
        - ICAO Annex 16 noise chapter certification
      Airport statistics identify airports by NAME in the CSV (e.g. "HEATHROW"), not
      by IATA or ICAO code, which forces a lookup join on free text.
      ATOL holders are keyed by CAA-issued ATOL licence number, a proprietary UK
      identifier with no equivalent elsewhere. The airline-ticket-agent exemption
      route references IATA accreditation and ticketing authority, which is where
      IATA/ARC agency numbering enters the UK picture.
      No PNR record locator, no GDS record ID, no hotel chain code, no GIATA ID —
      the CAA sits above booking-layer identifiers entirely.
  contractualLockIn:
    value: |
      Verbatim, from the CAA's own pages:
        - UK airport data (published on every monthly statistics page): "The
          information contained in these reports has been compiled from various
          sources of data. CAA validates this data, however, no warranty is given as
          to its accuracy, integrity or reliability. CAA cannot accept liability for
          any financial loss caused by a person's reliance on any of these
          statistics. No statistical data provided by CAA maybe sold on to a third
          party. CAA insists that they are referenced in any publication that makes
          reference to CAA Statistics."
        - G-INFO bulk download: the database is "authorised for use on a single PC
          only"; distribution, copying or networking requires written CAA consent;
          users cannot modify or redistribute the data. Cancellation within 7 days
          under distance selling regulations requires return of materials at the
          customer's expense.
        - data.gov.uk records the licence for UK Airport Statistics as "License not
          specified" (license_id "notspecified"). This is explicitly NOT the Open
          Government Licence, despite the CAA being a public corporation.
      The counterweight the CAA imposes ON industry — the regulatory answer to
      distribution intermediation — is ATOL:
        - "The ATOL Regulations equally apply to businesses established outside the
          UK if they are advertising and selling to consumers in the UK", and apply
          to flight-inclusive packages sold to UK consumers "irrespective of the
          departure point of the flight".
        - A business selling flights must hold its own ATOL unless it is "the operator
          of the aircraft (an airline selling its own services)", "an ATOL holder", or
          "a person who is exempt".
        - The airline ticket agent exemption requires a "written agreement with the
          airline to supply confirmed tickets" — or, for IATA-accredited agents,
          ticketing authority plus compliance with IATA rules — plus direct dealings
          with consumers only (selling to other travel businesses requires ATOL),
          immediate issue of confirmed tickets on payment, and a duty to "notify the
          consumer, that the business is an airline ticket agent for the named
          airline(s) and that the flight is not protected under the ATOL scheme".
      No API terms of service, no rate-limit policy and no SLA are published for any
      CAA API surface.
  accessGate:
    value: self-serve
    whatMustBeSigned: |
      Nothing, for the one documented API. The Citizen Space consultation API at
      consultations.caa.co.uk/api/2.4 requires no key, no account, no application and
      no agreement; an anonymous GET returned data on 2026-07-28.
      Everything else is gated differently and none of it is a developer gate:
        - G-INFO and Check an ATOL JSON backends: no gate a developer can pass — CORS
          is pinned to https://www.caa.co.uk and the ATOL widget carries a reCAPTCHA
          site key. There is no application process because there is no published
          programme.
        - Bulk G-INFO register: a paid subscription ordered on a form, with a
          single-PC licence. Commercial agreement in substance.
        - Anything else: Freedom of Information Act 2000 / EIR 2004 / UK GDPR subject
          access request.
        - portal.caa.co.uk is an ADFS WS-Federation login for regulated entities
          (licence and certificate holders), not a developer portal.
      To sell UK flights as an intermediary a business must instead hold an ATOL, or
      qualify for the airline-ticket-agent exemption via a written airline agreement
      or IATA accreditation — an industry accreditation gate, not an API gate.
  distributionModel:
    value: not-applicable
    ndcPosture: |
      Not applicable — the CAA is a regulator and distributes no travel inventory.
      It holds no NDC certification, publishes no NDC endpoint, and IATA's NDC
      certification registry is IATA's, not a national authority's. Nothing on
      caa.co.uk that was probed references NDC, OpenTravel/OTA or HTNG.
      The CAA's lever over distribution is regulatory rather than technical: ATOL
      licensing determines who may sell a flight-inclusive package to a UK consumer,
      including extraterritorially, and the airline-ticket-agent exemption is written
      around bilateral airline agreements and IATA accreditation — that is, around
      the incumbent structure rather than around NDC.

