aid: uk-caa
name: UK Civil Aviation Authority
review:
  question: Does the UK Civil Aviation Authority publish a public developer portal
    or documented API for its aviation data, and what would it cost a customer to
    leave?
  answer: partial
  date: '2026-07-28'
  reviewer: API Evangelist
  tier: regulator
  homeMarket: United Kingdom
  primaryDomain: caa.co.uk

findings:
  summary: |
    The UK CAA publishes no developer portal, no OpenAPI, no AsyncAPI, and no
    documented aviation data API. Every conventional developer entry point was
    probed and none resolved: developer.caa.co.uk, developers.caa.co.uk,
    api.caa.co.uk and docs.caa.co.uk do not resolve in DNS (curl exit 000);
    /api, /developers, /docs, /openapi.json, /swagger.json and /api-docs on
    www.caa.co.uk all return HTTP 404.

    Exactly one documented, self-serve, key-free public API exists on a CAA
    domain: the Citizen Space (Delib) consultation API at
    https://consultations.caa.co.uk/api/ — versions 2.0 through 2.4, methods
    json_search_results and json_consultation_details, verified live and
    returning a JSON array. It is the vendor's platform API, deployed for the
    CAA, and it is about consultations, not aviation.

    The two aviation surfaces that do speak JSON are undocumented internal
    backends for the CAA's own Angular widgets: ginfoapi.caa.co.uk (the G-INFO
    UK aircraft register search) and aircraftapi.caa.co.uk (the Check an ATOL
    search). Both are ASP.NET on Azure, both return HTTP 405 on GET and HTTP
    400 on an unauthenticated POST, both send
    "access-control-allow-origin: https://www.caa.co.uk", and the ATOL widget
    carries a reCAPTCHA site key. There is no documentation, no terms of use
    and no discoverable schema for either.

    Real bulk data exists but is file-shaped, not API-shaped: monthly airport,
    punctuality and airline statistics as CSV and PDF behind opaque
    /Documents/Download/{siteId}/{guid}/{docId} URLs, and a historic ATOL
    holders XLSX. The full G-INFO aircraft register is a paid subscription
    emailed as an MS Excel file, licensed for use on a single PC.
