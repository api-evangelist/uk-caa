data_quality:
  description: >-
    Findings observed while deriving this vocabulary from the live corpus. These are real
    defects in the CAA's published taxonomy, recorded rather than smoothed over.
  findings:
    - issue: duplicate-interest-ids
      detail: >-
        Four interest display names are backed by two ids each, differing only by a numeric
        suffix - "Airworthiness"/"Airworthiness-1", "Air Traffic Control"/"Air Traffic
        Control-1", "Manufacturers"/"Manufacturers-1", and "Economic regulation-1"/"Economic
        regulation-2" (there is no unsuffixed "Economic regulation" id). A consumer
        filtering with in=Airworthiness silently misses every activity tagged with the
        duplicate.
    - issue: identifiers-are-display-strings
      detail: >-
        Term ids are human-readable labels, not slugs - they carry spaces, ampersands,
        commas and case ("AMC, GM, Licencing", "Design & Certification"). They must be
        URL-encoded, and any change to the label is a breaking change to the id.
    - issue: trailing-whitespace-in-ids
      detail: >-
        Several ids end in a space and are therefore easy to mis-handle - "Internal ",
        "Internal Consultation ", "Aviation Design & Certification ", "RFFS Training
        Providers ".
    - issue: id-name-divergence
      detail: >-
        Some ids do not match their display name, including a typo preserved in the id -
        audience id "Ballons" displays as "Balloons"; interest id "AMC, GM, Licencing"
        displays as "AMC & GM consultations"; interest id "Implementing Regulations"
        displays as "Implementing Rules".
    - issue: areas-unavailable
      detail: >-
        The `ar` (area) parameter is documented, but no activity in the corpus carries an
        areas array - the reference itself notes the field "is omitted unless area support
        is installed". Area support is not installed on the CAA instance.
notes:
  - >-
    Scope limit worth stating plainly - this vocabulary describes the CAA's CONSULTATION
    platform, not UK aviation. The CAA publishes no aeronautical vocabulary: no AIXM, no
    digital AIP, no NOTAM feed, no code list of its own. See
    conformance/uk-caa-conformance.yml.
  - >-
    Terms are a moving target. Workspaces, audiences and interests are configured per
    Citizen Space site and can be added or renamed by CAA staff at any time; counts are a
    snapshot of 2026-07-28.
