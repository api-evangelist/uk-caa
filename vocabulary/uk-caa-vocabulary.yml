name: UK Civil Aviation Authority consultation vocabulary
description: >-
  The controlled vocabulary the UK Civil Aviation Authority actually uses to classify
  its public consultations and engagement activities, derived from the complete live
  corpus of every activity the CAA has published through the Citizen Space API
  (294 activities spanning 2016-03-15 to 2026-07-14). Nothing here is invented: every
  term id and display name below was emitted verbatim by the API on 2026-07-28, and the
  usage count is the number of activities carrying that term. This is the closest thing
  the CAA publishes to a machine-readable taxonomy of its own regulatory remit, and the
  only place in the estate where the regulator's internal structure (19 workspaces, from
  GA and Economic regulation to Cyber Security and Space) is exposed as stable ids.
