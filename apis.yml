apis:
- aid: uk-caa:caa-consultations-api
  name: CAA Consultations API
  description: >-
    The Citizen Space (Delib) public consultation API deployed on the CAA's
    consultations domain. Two documented methods — json_search_results and
    json_consultation_details — return published CAA consultation activities as JSON
    with no API key and no signup. Versions 2.0 through 2.4 are served concurrently.
    Verified live 2026-07-28 (HTTP 200, JSON array). This is the only documented,
    publicly callable API on a caa.co.uk domain; it is the vendor's platform API,
    not a CAA aviation data API.
  humanURL: https://consultations.caa.co.uk/api/2.4/
