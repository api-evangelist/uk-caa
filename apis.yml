name: UK Civil Aviation Authority
kind: company
description: >-
  The UK Civil Aviation Authority (CAA) is the United Kingdom's independent
  aviation regulator and a public corporation of the Department for Transport. It
  licenses UK airlines, registers UK civil aircraft on the G-INFO register, regulates
  airspace and airports, economically regulates Heathrow and Gatwick, enforces UK
  air passenger rights, and — the part that matters most to travel distribution —
  runs the Air Travel Organiser's Licence (ATOL) scheme, which is the statutory gate
  every business selling flight-inclusive packages to UK consumers must pass through,
  including sellers established outside the UK. The CAA sits above the distribution
  chain rather than inside it: it does not distribute inventory, does not operate a
  GDS or NDC connection, and has no NDC posture of its own. Its API posture is thin
  and honest to record — there is no developer portal, no OpenAPI, and no published
  aviation data API. The only documented, self-serve, key-free public API on a CAA
  domain is the Citizen Space (Delib) consultation API at consultations.caa.co.uk/api,
  a vendor platform API rather than an aviation data API. The aviation surfaces that
  do exist — the G-INFO aircraft register search and the Check an ATOL search — are
  undocumented ASP.NET JSON backends whose CORS policy is locked to www.caa.co.uk
  and which are reCAPTCHA-gated. Bulk aviation data is delivered as CSV, PDF and
  XLSX files behind opaque GUID download URLs, and the full G-INFO aircraft register
  is a paid subscription emailed as an MS Excel file licensed for use on a single PC.
  Home market is the United Kingdom.
