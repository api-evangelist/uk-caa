description: >-
  The UK Civil Aviation Authority publishes NO client libraries, SDKs or packages
  of any kind, in any language, on any registry. This file records the search so a
  later round does not have to repeat it. It is a deliberate empty result, not a
  gap in the harvest: the CAA operates no developer programme, so there is nothing
  for an SDK to wrap. No SDKs pointer is emitted in apis.yml, because there is no
  first-party client library to point at.
packages: []
search:
  probed: '2026-07-28'
  registries:
    - registry: npm
      queries: [citizenspace, citizen-space, delib, uk-caa, caa-api]
      result: >-
        No first-party package. Only `delib` returns 200 (npm 200) and it is an
        unrelated Ethereum DApp framework by zhiwenh — not the Citizen Space
        vendor Delib and not a CAA artifact.
    - registry: pypi
      queries: [citizenspace, uk-caa, caa-api, ukcaa]
      result: All 404.
    - registry: maven-central
      result: Not probed by name; no Java client is referenced anywhere in CAA or vendor documentation.
    - registry: nuget
      result: >-
        Not published. Notable because the two undocumented aviation JSON backends
        (ginfoapi.caa.co.uk, aircraftapi.caa.co.uk) are ASP.NET — the stack is .NET,
        the surface is still closed.
    - registry: pkg.go.dev
      result: No first-party module.
    - registry: rubygems
