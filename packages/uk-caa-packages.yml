notes:
  - >-
    A consumer of the CAA consultations API needs no package: two anonymous GET
    endpoints returning a JSON array. The absence of an SDK is proportionate to the
    surface, not a failing of it.
  - >-
    The absence that does matter is upstream — there is no aviation data API for an
    SDK to exist around. Bulk G-INFO is a paid MS Excel subscription licensed for a
    single PC (see lifecycle/uk-caa-lifecycle.yml).
