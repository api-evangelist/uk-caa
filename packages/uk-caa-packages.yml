      result: >-
        No CAA GitHub organisation exists. api.github.com/orgs/{ukcaa, uk-caa,
        civilaviationauthority, caa-uk, UKCivilAviationAuthority,
        ukcivilaviationauthority} all return 404 (probed 2026-07-28). There is
        therefore no SourceCode, SDK or CLI link in apis.yml to derive candidates
        from.
  documentation:
    - url: https://consultations.caa.co.uk/api/2.4/
      result: >-
        The one documented API reference offers no client library, no code sample
        in any language, and no download. Integration is a plain HTTPS GET.
    - url: https://help.delib.net/article/350-api-v2-x-developers-guide
      result: >-
        The vendor developer guide recommends server-side integration and permits
